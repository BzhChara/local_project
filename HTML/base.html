		function b64ToUtf8(b64) {
			if (!b64) return '';
			try {
				// 步骤1：过滤所有非base64合法字符
				let s = b64.replace(/[^A-Za-z0-9+/=]/g, ''); 
				// 步骤2：处理URL安全的base64（-替换为+，_替换为/）
				s = s.replace(/-/g, '+').replace(/_/g, '/');
				// 步骤3：补位（长度必须是4的倍数，不足补=）
				const pad = s.length % 4; 
				if (pad) s += '='.repeat(4 - pad);
				// 步骤4：解码
				const bin = atob(s);
				const bytes = new Uint8Array(bin.length);
				for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
				return new TextDecoder('utf-8').decode(bytes);
			} catch (e) {
				console.error('解码失败：', e);
				return '';
			}
		}

		function getQueryStr(url) {
			// 1. 处理空值/非字符串（兜底）
			if (!url || typeof url !== 'string') return '';
			// 2. 找到?的索引位置
			const questionMarkIndex = url.indexOf('?');
			// 3. 无?返回空，有?则截取?之后的部分
			return questionMarkIndex === -1 ? '' : url.slice(questionMarkIndex + 1);
		}

		// 格式化函数（自动识别字段）
		function formatAutoFields(text) {
		// 步骤1：清理多余空格
		let cleanText = text.replace(/\s+/g, ' ').trim();
		// 正则匹配：捕获「中文字段名：」+「字段值」（直到下一个「中文字段名：」结束）
		const regex = /([\u4e00-\u9fa5]+：)(.*?)(?=[\u4e00-\u9fa5]+：|$)/g;
		let result = [];
		
		// 遍历匹配结果
		let match;
		while ((match = regex.exec(cleanText)) !== null) {
			const field = match[1]; // 字段名（如「通道号：」）
			const value = match[2].trim(); // 字段值（如「3」）
			result.push(`${field}${value}`);
		}

		// 按换行符拼接，返回左对齐结果
		return result.join('\n');
		}
